<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les composantes d'un paysage – Révisions 6e – Le Labo des Savoirs</title>
<style>
:root{--n:#1b2a49;--g:#d4a537;--b:#f6efe0;--bio:#3a9d4f;--geo:#2f6fd0;--ant:#e8832a;--ok:#2e8b57;--ko:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--b);color:var(--n);font-size:17px}
header{background:var(--n);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--g)}
header h1{font-size:1.1rem;margin:0;flex:1}header .t{background:var(--g);color:var(--n);font-weight:700;border-radius:20px;padding:4px 12px}
#bar{height:10px;background:#e4d9bd}#bar i{display:block;height:100%;width:0;background:var(--g);transition:.4s}
main{max-width:900px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 10px #0002;margin-bottom:14px}
h2{margin:0 0 6px;color:var(--n)}h2 small{font-size:.65em;background:var(--g);padding:2px 10px;border-radius:12px;margin-left:8px;vertical-align:middle}
.mission{border-left:6px solid var(--g);background:#fff8e1;padding:10px 14px;border-radius:8px;margin:10px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 18px;background:var(--n);color:#fff;font-weight:600}button:hover{opacity:.88}button:disabled{opacity:.35;cursor:default}
.gold{background:var(--g);color:var(--n)}.nav{text-align:right;margin-top:10px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:640px){.cats{grid-template-columns:1fr}}
.bio{--c:var(--bio)}.geo{--c:var(--geo)}.ant{--c:var(--ant)}
.cat{border:3px solid var(--c);border-radius:12px;padding:8px;min-height:90px;background:#fff}.cat h3{margin:0 0 6px;color:var(--c);font-size:1rem;text-align:center}.cat.hot{background:#f4f8ff;cursor:pointer}
.chip{display:inline-block;margin:3px;padding:6px 12px;border-radius:18px;background:#fff;border:2px solid var(--n);cursor:pointer;user-select:none}.chip.sel{background:var(--g);transform:scale(1.08)}
.chip.in{cursor:default;color:#fff;border-color:var(--c);background:var(--c)}.shake{animation:s .3s}@keyframes s{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flip{border-radius:12px;padding:14px;color:#fff;background:var(--c);cursor:pointer;margin:8px 0}.flip .d{display:none;margin-top:8px;background:#fff;color:var(--n);border-radius:8px;padding:10px}.flip.open .d{display:block}
.pw{position:relative;display:inline-block;max-width:100%}.pw img{max-width:100%;border-radius:10px;display:block}.mk{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--g);color:var(--n);font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--n)}
select{font:inherit;padding:5px;border-radius:8px;border:2px solid var(--n)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;background:#eef;font-weight:600}.good{color:var(--ok)}.bad{color:var(--ko)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:#fff;color:var(--n);border:2px solid var(--n)}.opt.ok{background:#d6f5df;border-color:var(--ok)}.opt.ko{background:#fbd9d4;border-color:var(--ko)}
.ph{display:flex;gap:8px;flex-wrap:wrap}.ph img{width:31%;min-width:150px;border-radius:8px;flex:1}.big{font-size:3rem;text-align:center}.lst .chip{font-size:1.05rem}.chip.bar{text-decoration:line-through;opacity:.5}
</style></head><body>

const CN={bio:"Composantes biologiques",geo:"Composantes géologiques",ant:"Composantes anthropiques"},CS={bio:"biologiques",geo:"géologiques",ant:"anthropiques"};
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),pick=(a,n)=>sh(a).slice(0,n);
let score=0,max=0,step=0,t0=Date.now(),res=[];
setInterval(()=>$('#tm').textContent='⏱ '+Math.floor((Date.now()-t0)/60000)+' min',5000);
const M=$('#m');
function add(p,x){score+=p;max+=x;$('#pt').textContent='⭐ '+score+' pt'}
function shell(title,mins,body){M.innerHTML=`<div class="card"><h2>${title}<small>≈ ${mins} min</small></h2>${body}</div><div class="nav"><button class="gold" id="nx" disabled>Étape suivante ➜</button></div>`;$('#bar i').style.width=(step/STEPS.length*100)+'%';$('#nx').onclick=()=>{step++;STEPS[step]()};window.scrollTo(0,0)}
function done(p,x,label){add(p,x);res.push([label,p,x]);$('#nx').disabled=false;$('#nx').scrollIntoView({behavior:'smooth',block:'center'})}
const sel=(o,id)=>`<select ${id?'id="'+id+'"':''}><option value="">…</option>${o.map(x=>`<option>${x}</option>`).join('')}</select>`;

function sortGame(el,items,cb){let cur=null,left=items.length,pts=0;
 el.innerHTML=`<div class="cats">${['bio','geo','ant'].map(c=>`<div class="cat ${c}" data-c="${c}"><h3>${CN[c]}</h3><div></div></div>`).join('')}</div><p><b>Clique sur un mot</b>, puis sur sa boîte.</p><div class="lst" id="pool"></div>`;
 const pool=el.querySelector('#pool');
 sh(items).forEach(it=>{const s=document.createElement('span');s.className='chip';s.textContent=it.w;s.onclick=()=>{if(s.classList.contains('in'))return;el.querySelectorAll('.chip.sel').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');cur={s,it}};pool.appendChild(s)});
 el.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{if(!cur)return;const{s,it}=cur;
  if(it.c===b.dataset.c){s.className='chip in '+it.c;b.lastChild.appendChild(s);if(!it.e)pts++;cur=null;if(!--left)cb(pts,items.length)}
  else{it.e=1;s.classList.add('shake');setTimeout(()=>s.classList.remove('shake'),300)}})}

const S1=()=>{shell("1. Je découvre les définitions",8,`<div class="mission"><b>MISSION :</b> décrire et interpréter les différentes composantes d'un paysage.<br><b>Problème :</b> de quoi est formé un paysage ?</div>
<p><b>Un paysage est une partie de l'espace que l'on observe.</b> Des êtres vivants (faune et flore) et des éléments non vivants le composent. <i>Clique sur chaque carte pour la lire.</i></p>
<div class="flip bio"><b>🌿 Les composantes biologiques</b><div class="d">Ce sont <b>les éléments qui se rapportent aux êtres vivants</b> : arbres, branches mortes, fleurs, herbe, fougères, animaux, plumes, crottes…</div></div>
<div class="flip geo"><b>🪨 Les composantes géologiques</b><div class="d">Ce sont <b>les éléments issus de notre planète</b>, nommés aussi <b>composantes minérales</b> : <b>l'eau, l'air et les nuages, les roches</b>.</div></div>
<div class="flip ant"><b>🏗️ Les composantes anthropiques</b><div class="d">Ce sont <b>les éléments non naturels, fabriqués par l'être humain</b> : bâtiments, ponts, routes, véhicules, éoliennes…</div></div>
<div class="mission"><b>Pour décrire un paysage</b>, on prend en compte le relief, les roches, la présence d'eau (rivière, lac, mer…), la végétation (forêts, champs, prés…) et les éléments liés à l'activité humaine.</div>
<p>👉 Les mots <b>vivant</b> / <b>non vivant</b> : les composantes biologiques sont <i>vivantes</i> ; les composantes géologiques et anthropiques sont <i>non vivantes</i>.</p>`);
 let n=0;document.querySelectorAll('.flip').forEach(f=>f.onclick=()=>{if(!f.classList.contains('open')){f.classList.add('open');if(++n==3)done(0,0,'Découverte')}})};

const POOL=[...["arbre","fougère","herbe","fleur","vache","mésange","coccinelle","sauterelle","chardon","branche morte","plume","pin","algue","cerf"].map(w=>({w,c:'bio'})),
...["eau","roche","falaise","sable","galets","nuage","air","glacier","torrent","rivière","montagne","vague","charbon","cailloux","lac","neige"].map(w=>({w,c:'geo'})),
...["maison","pont","route","éolienne","barrage","château","autoroute","antenne","digue","parasol","chalet","voiture"].map(w=>({w,c:'ant'}))];
const S2=()=>{shell("2. Je trie les composantes",10,`<p>Range chaque mot dans la bonne boîte. <b>Deux manches</b> : 12 mots, puis 15 mots.</p><div id="g"></div>`);
 const mk=n=>['bio','geo','ant'].flatMap(c=>pick(POOL.filter(x=>x.c==c),n/3)).map(x=>({...x}));
 sortGame($('#g'),mk(12),(p,x)=>{add(p,x);res.push(['Tri manche 1',p,x]);$('#g').insertAdjacentHTML('beforebegin',`<div class="fb good">Manche 1 : ${p}/${x} 👏 Manche 2 !</div>`);
  sortGame($('#g'),mk(15),(p2,x2)=>done(p2,x2,'Tri manche 2'))})};

const S3=()=>{const L=["ciel","falaise","village","arbre","herbe","galets","rivière","pont","voiture","nuage"];
 shell("3. Je légende la photographie n°1 (Dordogne)",8,`<div class="mission"><b>Méthode :</b> les mots de légende s'écrivent sans déterminant et sans faute d'orthographe.</div>
 <div class="pw"><img src="${IMG.p1}">${MK.map((m,i)=>`<span class="mk" style="left:${m[0]*100}%;top:${m[1]*100}%">${i+1}</span>`).join('')}</div>
 ${MK.map((m,i)=>`<div class="row"><b>${i+1}</b> ${sel(L,'l'+i)} <select id="k${i}"><option value="">catégorie…</option><option value="bio">🟢 biologique</option><option value="geo">🔵 géologique</option><option value="ant">🟠 anthropique</option></select></div>`).join('')}
 <button id="v">Vérifier</button><div id="f"></div>`);
 $('#v').onclick=()=>{let p=0,out='';MK.forEach((m,i)=>{const a=$('#l'+i).value==m[2],b=$('#k'+i).value==m[3];p+=a+b;out+=`<div>${i+1}. ${a&&b?'✅':'❌'} <b>${m[2]}</b> → ${CS[m[3]]}</div>`});
  $('#f').innerHTML=`<div class="fb">${out}<p>Score : ${p}/14 · Rappel : le ciel (air) et l'eau sont des composantes géologiques.</p></div>`;$('#v').disabled=true;done(p,14,'Légende photo 1')}};

const W4=[["plage","geo"],["barrage","ant"],["chalet","ant"],["herbe","bio"],["vague","geo"],["vache","bio"],["château","ant"],["planche de surf","ant"],["pin","bio"],["algue","bio"],["falaise","geo"],["glaciers","geo"],["village","ant"],["alpage","ant"],["La Loire","geo"]].map(([w,c])=>({w,c}));
const S4=()=>{shell("4. Je classe les éléments des photos 2, 3 et 4",8,`<div class="ph"><img src="${IMG.p2}"><img src="${IMG.p3}"><img src="${IMG.p4}"></div><p><small>Photo 2 : Lacanau · Photo 3 : barrage de Grangent · Photo 4 : la Vanoise. <i>L'alpage est un pâturage d'altitude entretenu par l'être humain.</i></small></p><div id="g"></div>`);
 sortGame($('#g'),W4.map(x=>({...x})),(p,x)=>done(p,x,'Photos 2-3-4'))};

const IN=[[["eau","sable","parasol","falaise"],2,"ant","geo"],[["coccinelle","coquille","cailloux","branche"],2,"geo","bio"],[["glacier","cumulonimbus","éolienne","charbon"],2,"ant","geo"],[["château","mésange","chardon","sauterelle"],0,"ant","bio"],[["antenne","digue","torrent","autoroute"],2,"geo","ant"],[["rocher","fougère","herbe","pin"],0,"geo","bio"],[["nuage","lac","route","roche"],2,"ant","geo"],[["vache","pont","fleur","algue"],1,"ant","bio"]];
const S5=()=>{const Q=pick(IN,5);shell("5. Barre l'intrus et justifie avec « car »",8,`<div class="mission"><b>Méthode :</b> « L'intrus est … <b>car</b> il est le seul mot représentant une composante …, les autres désignent des composantes … »</div>
 ${Q.map((q,i)=>`<div class="card lst" id="q${i}"><div>${q[0].map((w,j)=>`<span class="chip" data-j="${j}">${w}</span>`).join('')}</div><div class="row">car il est le seul mot représentant une composante ${sel(['biologique','géologique','anthropique'],'a'+i)} ; les autres désignent des composantes ${sel(['biologiques','géologiques','anthropiques'],'b'+i)}.</div></div>`).join('')}<button id="v">Vérifier</button><div id="f"></div>`);
 const ch=[];document.querySelectorAll('.lst').forEach((d,i)=>d.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{d.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');ch[i]=+c.dataset.j}));
 const N={bio:'biologique',geo:'géologique',ant:'anthropique'};
 $('#v').onclick=()=>{let p=0,o='';Q.forEach((q,i)=>{const r=ch[i]===q[1],a=$('#a'+i).value===N[q[2]],b=$('#b'+i).value===CS[q[3]];p+=r+(a&&b);
  o+=`<div>${r&&a&&b?'✅':'❌'} Intrus : <b>${q[0][q[1]]}</b> (${N[q[2]]}), les autres sont ${CS[q[3]]}.</div>`;document.querySelectorAll('#q'+i+' .chip')[q[1]].classList.add('bar')});
  $('#f').innerHTML=`<div class="fb">${o}<p>Score : ${p}/10</p></div>`;$('#v').disabled=true;done(p,10,'Intrus')}};

const TX=[["Un paysage est une partie de l'","espace"," que l'on observe."],["Les êtres vivants (faune et flore) forment les composantes ","biologiques","."],["L'eau, l'air et les roches sont des composantes ","géologiques",", aussi appelées composantes minérales."],["Les bâtiments, les ponts et les routes sont des composantes ","anthropiques"," : ils sont fabriqués par l'être humain."],["Pour décrire un paysage, on observe d'abord le ","relief",", les roches et la présence d'eau."],["La ","végétation"," (forêts, champs, prés) fait partie de la composante biologique."]];
const S6=()=>{const B=["espace","biologiques","géologiques","anthropiques","relief","végétation","animaux","minérales"];
 shell("6. Je complète les définitions",6,`<p>Banque de mots : ${B.map(w=>`<span class="chip">${w}</span>`).join('')}</p>${TX.map((t,i)=>`<p>${t[0]}${sel(B,'t'+i)}${t[2]}</p>`).join('')}<button id="v">Vérifier</button><div id="f"></div>`);
 $('#v').onclick=()=>{let p=0;TX.forEach((t,i)=>{const e=$('#t'+i),ok=e.value===t[1];p+=ok;e.style.borderColor=ok?'#2e8b57':'#c0392b';if(!ok)e.insertAdjacentHTML('afterend',` <b class="bad">→ ${t[1]}</b>`)});
  $('#f').innerHTML=`<div class="fb">Score : ${p}/${TX.length}</div>`;$('#v').disabled=true;done(p,TX.length,'Texte à trous')}};

const QZ=[["Qu'est-ce qu'un paysage ?",["Une partie de l'espace que l'on observe","Un tableau de peintre","Une ville uniquement"],0],["Quelles sont les 3 composantes d'un paysage ?",["Biologiques, géologiques, anthropiques","Rouges, bleues, vertes","Animales, végétales, humaines"],0],["Un chêne est une composante…",["biologique","géologique","anthropique"],0],["Une rivière est une composante…",["géologique","biologique","anthropique"],0],["Une éolienne est une composante…",["anthropique","géologique","biologique"],0],["Les nuages et l'air sont des composantes…",["géologiques (minérales)","biologiques","anthropiques"],0],["Que signifie « anthropique » ?",["Fabriqué par l'être humain","Issu de la planète","Qui est vivant"],0],["Les composantes géologiques sont aussi appelées…",["composantes minérales","composantes humaines","composantes vivantes"],0],["Une plume est une composante…",["biologique","géologique","anthropique"],0],["Un pont est une composante…",["anthropique","géologique","biologique"],0],["Une falaise est une composante…",["géologique","biologique","anthropique"],0],["Quelles composantes sont VIVANTES ?",["Les composantes biologiques","Les composantes géologiques","Les composantes anthropiques"],0],["Vrai ou faux : une route est une composante géologique.",["Faux : elle est anthropique","Vrai"],0],["Que faut-il observer pour décrire un paysage ?",["Relief, roches, eau, végétation, activité humaine","Seulement les couleurs","Seulement les bâtiments"],0]];
const S7=()=>{const Q=pick(QZ,8);let i=0,p=0;shell("7. Quiz éclair",8,`<div id="qz"></div>`);
 const show=()=>{if(i==Q.length){$('#qz').innerHTML=`<div class="big">🏁</div><p>Quiz terminé : ${p}/${Q.length}</p>`;return done(p,Q.length,'Quiz')}
  const q=Q[i],o=sh(q[1].map((t,k)=>({t,k})));$('#qz').innerHTML=`<p><b>Question ${i+1}/${Q.length}</b><br>${q[0]}</p>${o.map(x=>`<button class="opt" data-k="${x.k}">${x.t}</button>`).join('')}<div id="f"></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q[2];document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q[2])x.classList.add('ok')});if(ok)p++;else b.classList.add('ko');i++;
   $('#f').innerHTML=`<div class="nav"><button class="gold" id="s">Suite ➜</button></div>`;$('#s').onclick=show})};show()};

const S8=()=>{$('#bar i').style.width='100%';const pc=Math.round(score/max*100),md=pc>=90?'🥇':pc>=70?'🥈':pc>=50?'🥉':'💪';
 M.innerHTML=`<div class="card"><div class="big">${md}</div><h2 style="text-align:center">Bilan : ${score}/${max} (${pc} %)</h2><p style="text-align:center">${pc>=90?'Bravo, tu maîtrises les composantes d\'un paysage !':pc>=70?'Très bien ! Relis les définitions et refais le parcours.':'Relis la leçon puis recommence : les questions changent à chaque partie.'}</p>
 ${res.filter(r=>r[2]).map(r=>`<div class="row"><b style="flex:1">${r[0]}</b><span>${r[1]}/${r[2]}</span></div>`).join('')}</div>
 <div class="card"><h2>📌 Je retiens</h2><div class="mission"><b>Un paysage est une partie de l'espace que l'on observe.</b></div>
 <div class="cats"><div class="cat bio"><h3>Biologiques</h3>Êtres vivants : arbres, fleurs, herbe, animaux, plumes…</div><div class="cat geo"><h3>Géologiques</h3>Éléments issus de la planète : eau, air, nuages, roches</div><div class="cat ant"><h3>Anthropiques</h3>Éléments fabriqués par l'être humain : bâtiments, ponts, routes, éoliennes…</div></div></div>
 <div class="nav"><button class="gold" onclick="location.reload()">🔄 Recommencer</button></div>`};

const S0=()=>{M.innerHTML=`<div class="card" style="text-align:center"><div class="big">🦉🌄</div><h2>Les composantes d'un paysage</h2><p>Parcours de révisions · 6e · durée : <b>1 heure</b></p><p>7 étapes : découvrir, trier, légender, classer, trouver l'intrus, compléter, quiz.<br>Les questions changent à chaque partie !</p><button class="gold" id="go">C'est parti ➜</button></div>`;$('#go').onclick=()=>{t0=Date.now();step=1;STEPS[1]()}};
const STEPS=[S0,S1,S2,S3,S4,S5,S6,S7,S8];S0();
</script></body></html>
